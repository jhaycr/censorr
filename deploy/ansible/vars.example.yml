# Example variables for deploying the Censorr container
# Copy into your group_vars/ or host_vars/ and adjust values.

censorr_enabled: true

censorr_image_repo: ghcr.io/jhaycr/censorr
censorr_image_tag: v0.1.0
censorr_force_pull: false

# Optional: Build from private Git repo instead of pulling image
censorr_build_enabled: false
censorr_git_repo: https://github.com/jhaycr/censorr_private.git
censorr_git_ref: main
censorr_dockerfile: Dockerfile
# Provide Git token via BuildKit secret; recommend storing in Ansible Vault as a file or variable
# Example approach (inventory): censorr_git_token: "{{ vault_censorr_git_token }}" (no_log)
# And render to a temporary file for BuildKit: CENSORR_GIT_TOKEN_FILE=/run/ansible/censorr_git_token

censorr_container_name: censorr
# Optional UID/GID if running non-root inside container (image must support)
censorr_user_id: null
censorr_group_id: null

# Required volumes (adjust host paths)
censorr_volumes:
  - { host: /mnt/media, container: /media, mode: ro }
  - { host: /srv/censorr/work, container: /app/workdir, mode: rw }

# Optional log volume (example)
#  - { host: /srv/censorr/logs, container: /app/logs, mode: rw }

# Environment variables (non-secret). For secrets, pull from vault.
censorr_env:
  TZ: "UTC"
  CENSORR_VERBOSE: "true"
  # CENSORR_JOBS: "4"
  # CENSORR_SIDEcar_TAG: "clean"

# Additional labels
censorr_labels: {}
#  traefik.enable: "false"

# Optional health check (command-based)
censorr_health: null
# censorr_health:
#   command: ["censorr", "--version"]
#   interval_seconds: 30
#   timeout_seconds: 5
#   retries: 3
#   start_period_seconds: 10

# Resource constraints (Compose semantics)
censorr_cpu_shares: null   # e.g., 256
censorr_mem_limit: null     # e.g., 512m

censorr_timezone: UTC
