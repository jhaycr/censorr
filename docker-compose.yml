version: "3.9"

services:
  censorr:
    container_name: censorr
    build: .
    restart: unless-stopped
    command: worker
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
      CENSORR_VERBOSE: ${CENSORR_VERBOSE:-false}
      PUID: ${UID:-1000}
      PGID: ${GID:-1000}
      CENSORR_QUEUE_PATH: /app/queue
      CENSORR_QUEUE_MAX_RETRIES: ${CENSORR_QUEUE_MAX_RETRIES:-3}
      CENSORR_QUEUE_LEASE_SECONDS: ${CENSORR_QUEUE_LEASE_SECONDS:-1800}
      CENSORR_WORKER_POLL_INTERVAL: ${CENSORR_WORKER_POLL_INTERVAL:-2}
    volumes:
      - ${MEDIA_PATH_TV:-/mnt/media/tv}:/data/media/tv
      - ${MEDIA_PATH_MOVIES:-/mnt/media/movies}:/data/media/movies
      - ${WORKDIR_PATH:-/srv/censorr/work}:/app/workdir:rw
      - ${CONFIG_PATH:-/srv/censorr/config}:/app/config:rw
      - ${QUEUE_PATH:-/srv/censorr/queue}:/app/queue:rw
    labels:
      org.censorr.service: "censorr-daemon"
      org.censorr.version: "local-build"

  censorr-webhook:
    container_name: censorr-webhook
    build: .
    restart: unless-stopped
    command: webhook
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
      CENSORR_WEBHOOK_ALLOWLIST: ${CENSORR_WEBHOOK_ALLOWLIST:-censorr_profile}
      CENSORR_WEBHOOK_SECRET: ${CENSORR_WEBHOOK_SECRET:-}
      CENSORR_WEBHOOK_MAX_SIZE: ${CENSORR_WEBHOOK_MAX_SIZE:-1048576}
      PUID: ${UID:-1000}
      PGID: ${GID:-1000}
      CENSORR_QUEUE_PATH: /app/queue
    ports:
      - "${WEBHOOK_PORT:-8000}:8000"
    volumes:
      - ${MEDIA_PATH_TV:-/mnt/media/tv}:/data/media/tv
      - ${MEDIA_PATH_MOVIES:-/mnt/media/movies}:/data/media/movies
      - ${WORKDIR_PATH:-/srv/censorr/work}:/app/workdir:rw
      - ${CONFIG_PATH:-/srv/censorr/config}:/app/config:rw
      - ${QUEUE_PATH:-/srv/censorr/queue}:/app/queue:rw
    depends_on:
      - censorr
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      org.censorr.service: "censorr-webhook"
      org.censorr.version: "local-build"
