version: "3.9"

services:
  censorr:
    container_name: censorr
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
      CENSORR_VERBOSE: ${CENSORR_VERBOSE:-false}
      PUID: ${UID:-1000}
      PGID: ${GID:-1000}
    volumes:
      - ${MEDIA_PATH_TV:-/mnt/media/tv}:/data/media/tv
      - ${MEDIA_PATH_MOVIES:-/mnt/media/movies}:/data/media/movies
      - ${WORKDIR_PATH:-/srv/censorr/work}:/app/workdir:rw
      - ${CONFIG_PATH:-/srv/censorr/config}:/app/config:rw
    healthcheck:
      test: ["CMD", "censorr", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      org.censorr.service: "censorr"
      org.censorr.version: "local-build"
