# Censorr v2 — one image, two roles.
#   serve: webhook/API (no media access, no ffmpeg use; queue + config only)
#   work:  pipeline worker (ffmpeg; queue + config + media + scratch)
# Copy .env.example to .env to customize paths.
#
# Sources are mounted read-only: censorr never modifies originals (Q18 —
# clean copies land in the separate *-clean roots, which are read-write).

services:
  serve:
    build: .
    image: censorr:local
    container_name: censorr-serve
    command: serve
    restart: unless-stopped
    ports:
      - "${CENSORR_PORT:-8000}:8000"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - queue:/app/queue
      # rw: the web UI's config editor writes censorr.toml
      - ${CONFIG_PATH:-./config}:/app/config
      # ro sources power the UI's path browser (Q19); serve never writes
      # media and still mounts no clean roots.
      - ${MEDIA_PATH_MOVIES:-/mnt/media/movies}:/data/media/movies:ro
      - ${MEDIA_PATH_TV:-/mnt/media/tv}:/data/media/tv:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  work:
    build: .
    image: censorr:local
    container_name: censorr-work
    command: work
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - queue:/app/queue
      - work:/app/work
      - ${CONFIG_PATH:-./config}:/app/config:ro
      - ${MEDIA_PATH_MOVIES:-/mnt/media/movies}:/data/media/movies:ro
      - ${MEDIA_PATH_TV:-/mnt/media/tv}:/data/media/tv:ro
      - ${MEDIA_PATH_MOVIES_CLEAN:-/mnt/media/movies-clean}:/data/media/movies-clean
      - ${MEDIA_PATH_TV_CLEAN:-/mnt/media/tv-clean}:/data/media/tv-clean
    depends_on:
      - serve

volumes:
  queue:
  work:
