version: "3.9"

services:
  censorr:
    container_name: ${CONTAINER_NAME:-censorr}
    build: .
    # Alternatively use a published image by setting IMAGE_REPO/TAG
    image: ${IMAGE_REPO:-jhaycr/censorr}:${IMAGE_TAG:-latest}
    env_file:
      - ./.env
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      CENSORR_VERBOSE: ${CENSORR_VERBOSE:-false}
      PUID: ${UID:-1000}
      PGID: ${GID:-1000}
    volumes:
      - ${TV_HOST_PATH:-/mnt/media/tv}:/data/media/tv:ro
      - ${MOVIES_HOST_PATH:-/mnt/media/movies}:/data/media/movies:ro
      - ${WORKDIR_PATH:-/srv/censorr/work}:/app/workdir:rw
      - ${CONFIG_PATH:-/srv/censorr/config}:/app/config:rw
    healthcheck:
      test: ["CMD", "censorr", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      org.censorr.service: "censorr"
      org.censorr.version: "${IMAGE_TAG:-dev}"
