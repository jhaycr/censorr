name: PR Gates (Feature-Sized)

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  size-and-body-check:
    name: Enforce size caps and PR body fields
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - name: Check PR size and required body fields
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) { core.setFailed('No PR context'); return; }

            // Required sections in PR body
            const body = (pr.body || '').toLowerCase();
            const requiredSections = ['slice scope', 'tests added', 'size & files'];
            const missing = requiredSections.filter(s => !body.includes(s));

            // Fetch PR files for counts
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const caps = { files: 10, adds: 400, dels: 400 };
            let totalAdds = 0, totalDels = 0;
            let fileCount = 0;
            const skipPaths = [/^vendor\//, /^third_party\//, /lockfile/i];

            for (const f of files) {
              const skip = skipPaths.some(rx => rx.test(f.filename));
              if (!skip) {
                fileCount += 1;
                totalAdds += f.additions || 0;
                totalDels += f.deletions || 0;
              }
            }

            const oversized = (fileCount > caps.files) || (totalAdds > caps.adds) || (totalDels > caps.dels);
            const hasJustification = body.includes('oversized change justification');

            let notes = [];
            notes.push(`Files considered: ${fileCount} (cap ${caps.files})`);
            notes.push(`Additions: +${totalAdds} (cap +${caps.adds})`);
            notes.push(`Deletions: -${totalDels} (cap -${caps.dels})`);

            if (missing.length) {
              core.setFailed(`Missing PR body sections: ${missing.join(', ')}`);
              return;
            }

            if (oversized && !hasJustification) {
              core.setFailed(`PR exceeds size caps without an Oversized Change Justification.\n${notes.join('\n')}`);
              return;
            }

            core.info(`PR size within caps or justified.\n${notes.join('\n')}`);
