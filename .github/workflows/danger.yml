name: Danger Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  danger:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Danger JS
        uses: danger/danger-js@11
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
