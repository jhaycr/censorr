[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "censorr"
version = "2.0.0"
description = "Censors profane audio and subtitles in media files for Plex/Sonarr/Radarr"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "rapidfuzz>=3.9.0",
    "pysubs2>=1.7.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
censorr = "censorr.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["censorr*"]

[tool.setuptools.package-data]
censorr = ["wordlists/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["scripts", "deploy", "docs", "examples", ".specify", ".kiro"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "UP", "S", "B", "A", "C4", "PIE", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# These modules shell out to ffmpeg/ffprobe on PATH by design (N1: "FFmpeg
# >= 6 on PATH"); args are always passed as lists, never through a shell.
"censorr/media/**" = ["S603", "S607"]
"tests/fixtures.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["censorr"]

[[tool.mypy.overrides]]
module = ["pysubs2.*", "rapidfuzz.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "ffmpeg: integration tests that shell out to real ffmpeg/ffprobe",
    "docker: tests that build/run the container image",
]
